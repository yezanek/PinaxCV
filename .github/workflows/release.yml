name: Release

# Builds the Linux AppImage, the only release for now (issue #68; Flatpak,
# Snap and Windows are on hold). A `v*` tag makes a draft GitHub release
# with the AppImage attached; any other run keeps it as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - src-tauri/icons/**
      - src-tauri/tauri.updater.conf.json

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: AppImage
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Ubuntu 22.04 is the oldest supported base, so the AppImage runs on
      # it and on newer distributions (glibc is not bundled).
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev libfuse2
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pinaxcv"))')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi
      # Updates are signed (issue #70, ADR-095). The repository variable
      # TAURI_UPDATER_PUBKEY is built into the app; the secret
      # TAURI_SIGNING_PRIVATE_KEY (and its password) signs the AppImage and
      # makes tauri-action upload latest.json. Without them the AppImage is
      # built unsigned and cannot update itself.
      - name: Updater signing
        id: signing
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.TAURI_UPDATER_PUBKEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No updater key set (TAURI_UPDATER_PUBKEY variable, TAURI_SIGNING_PRIVATE_KEY secret): this AppImage cannot update itself."
          fi
      - name: Build UI (Trunk)
        working-directory: ui
        run: trunk build --release --locked
      - name: Build the AppImage
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINAXCV_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2.12.3
          args: --bundles appimage ${{ steps.signing.outputs.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: PinaxCV ${{ github.ref_name }}
          releaseBody: Linux AppImage. See CHANGELOG.md for what changed.
          releaseDraft: true
      - name: Check the AppImage
        run: |
          appimage=$(ls target/release/bundle/appimage/*.AppImage)
          echo "Built $appimage ($(du -h "$appimage" | cut -f1))"
          chmod +x "$appimage"
          cd "$RUNNER_TEMP"
          "$OLDPWD/$appimage" --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/pinaxcv
          test -f squashfs-root/pinaxcv.desktop || ls squashfs-root/*.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: pinaxcv-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Clean-install smoke test (issue #73): the AppImage starts on fresh
  # distributions with only an X server added, opens its window and creates
  # its database and log. It is the automated part of the release pass;
  # docs/RELEASING.md lists the manual part.
  clean-install:
    name: Starts on ${{ matrix.image }}
    needs: appimage
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "fedora:41"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pinaxcv-appimage
      # An AppImage leaves out the libraries every desktop has (the AppImage
      # excludelist: fontconfig, FreeType, HarfBuzz, Mesa, X11 and so on), so
      # those and an X server are all the container gets.
      - name: Install an X server and the desktop base libraries
        run: |
          if command -v apt-get > /dev/null; then
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y \
              xvfb xauth procps fontconfig libfreetype6 libharfbuzz0b libfribidi0 libthai0 \
              libgl1 libegl1 libgbm1 libx11-6 libx11-xcb1 libxcb1 libdrm2 libexpat1 \
              libgpg-error0 libcom-err2 libuuid1 zlib1g
          else
            dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth procps-ng findutils \
              fontconfig freetype harfbuzz fribidi libthai mesa-libGL mesa-libEGL mesa-libgbm \
              libX11 libX11-xcb libxcb libdrm expat libgpg-error libcom_err libuuid zlib
          fi
      - name: Start the AppImage
        env:
          # Containers have no FUSE: the runtime unpacks to a temporary folder.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_CLEANUP: "1"
        run: |
          appimage=$(ls ./*.AppImage)
          chmod +x "$appimage"
          export HOME=$(mktemp -d)
          xvfb-run -a "$appimage" > app.log 2>&1 &
          for i in $(seq 1 60); do
            if [ -f "$HOME/.local/share/dev.pinaxcv.app/pinaxcv.sqlite3" ]; then break; fi
            sleep 1
          done
          sleep 5
          if ! pgrep -f pinaxcv > /dev/null; then
            echo "The app is not running." >&2; cat app.log >&2; exit 1
          fi
          test -f "$HOME/.local/share/dev.pinaxcv.app/pinaxcv.sqlite3" || { echo "No database was created." >&2; cat app.log >&2; exit 1; }
          ls "$HOME/.local/share/dev.pinaxcv.app/logs/"
          grep -q "" "$HOME/.local/share/dev.pinaxcv.app/logs/"* || { echo "The log is empty." >&2; exit 1; }
          echo "The AppImage started on ${{ matrix.image }}."
          pkill -f pinaxcv || true
