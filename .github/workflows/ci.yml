name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS is an early-warning job only (ADR-007): it never blocks a merge.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      # The desktop shell embeds ui/dist at compile time.
      - name: Build UI (Trunk)
        working-directory: ui
        run: trunk build --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: UI and UI-shared crates build for WASM
        run: cargo clippy -p cv-core -p cv-api -p pinaxcv-ui --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Dependency boundaries
        shell: bash
        run: scripts/check-boundaries.sh
