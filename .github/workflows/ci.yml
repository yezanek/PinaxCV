name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS is an early-warning job only (ADR-007): it never blocks a merge.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      # The desktop shell embeds ui/dist at compile time.
      - name: Build UI (Trunk)
        working-directory: ui
        run: trunk build --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: UI and UI-shared crates build for WASM
        run: cargo clippy -p cv-core -p cv-api -p pinaxcv-ui --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Dependency boundaries
        shell: bash
        run: scripts/check-boundaries.sh

  # Exports every fixture and parses the PDFs with OpenResume's open-source
  # resume parser (ADR-061). The parser is AGPL-3.0: CI clones it at a pinned
  # commit and runs it; it is never copied into this repository.
  ats-parser:
    name: resume parser
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ats-parser
      - name: Export the fixtures
        run: cargo run --locked -p cv-render --example export_fixtures -- "$RUNNER_TEMP/fixtures"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch OpenResume's parser
        working-directory: scripts/ats-parser
        run: |
          git init -q open-resume
          git -C open-resume fetch -q --depth 1 https://github.com/xitanggg/open-resume.git 4f8255a2c763479837f69f1dccf2a3338730cd79
          git -C open-resume checkout -q FETCH_HEAD
      - name: Parse the exported PDFs
        working-directory: scripts/ats-parser
        run: |
          npm ci --no-audit --no-fund
          npx tsx check.ts "$RUNNER_TEMP/fixtures"
