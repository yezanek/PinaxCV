name: Spikes

on:
  pull_request:
    paths: ["spikes/**", ".github/workflows/spikes.yml"]
  workflow_dispatch:

concurrency:
  group: spikes-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  typst-pdf:
    name: typst-pdf (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    defaults:
      run:
        shell: bash
        working-directory: spikes/typst-pdf
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/typst-pdf
      - name: Run spike
        run: cargo run --release --locked | tee -a "$GITHUB_STEP_SUMMARY"

  tauri-leptos:
    name: tauri-leptos (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    defaults:
      run:
        shell: bash
        working-directory: spikes/tauri-leptos
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/tauri-leptos
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: Build UI (Trunk)
        working-directory: spikes/tauri-leptos/ui
        run: |
          start=$(date +%s)
          trunk build --release --locked
          echo "trunk build: $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build Tauri shell
        run: |
          start=$(date +%s)
          cargo build --release --locked -p spike-tauri
          echo "tauri build: $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
