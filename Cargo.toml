[workspace]
resolver = "3"
members = [
    "crates/cv-core",
    "crates/cv-api",
    "crates/cv-store",
    "crates/cv-render",
    "crates/cv-import",
    "crates/cv-ai",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/yezanek/pinaxcv"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace.dependencies]
cv-core = { path = "crates/cv-core" }
cv-api = { path = "crates/cv-api" }
async-trait = "0.1.92"
proptest = "1.12.0"
regex = "1.13.1"
tempfile = "3.27.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1"
tokio-util = "0.7.20"
