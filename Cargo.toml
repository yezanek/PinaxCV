[workspace]
resolver = "3"
members = [
    "crates/cv-core",
    "crates/cv-api",
    "crates/cv-store",
    "crates/cv-render",
    "crates/cv-import",
    "crates/cv-ai",
    "crates/cv-app",
    "crates/e2e",
    "src-tauri",
    "ui",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/yezanek/pinaxcv"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace.dependencies]
cv-core = { path = "crates/cv-core" }
cv-api = { path = "crates/cv-api" }
cv-app = { path = "crates/cv-app" }
cv-import = { path = "crates/cv-import" }
cv-render = { path = "crates/cv-render" }
cv-store = { path = "crates/cv-store" }
async-trait = "0.1.92"
insta = "1.49.0"
lopdf = "0.45.0"
roxmltree = "0.21.1"
unicode-normalization = "0.1.25"
pdf-extract = "0.12.1"
proptest = "1.12.0"
regex = "1.13.1"
tempfile = "3.27.0"
tauri = "2.12.3"
tauri-build = "2.7.2"
tauri-plugin-dialog = "2.8.2"
typst = "=0.15.1"
leptos = { version = "0.8.22", features = ["csr"] }
console_error_panic_hook = "0.1.7"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.79", features = ["Window", "Location", "Crypto", "Document", "Element", "DomRect", "DomTokenList", "PointerEvent", "NodeList"] }
js-sys = "0.3.79"
ulid = "3.0.0"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1"
tokio-util = "0.7.20"
ureq = { version = "3.5.0", default-features = false, features = ["json"] }
